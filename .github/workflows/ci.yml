name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - uses: actions/cache@v4
        with:
          path: models
          key: models-${{ hashFiles('scripts/fetch_models.py') }}
      - run: uv run python scripts/fetch_models.py
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app scripts
      - run: uv run pytest -q
